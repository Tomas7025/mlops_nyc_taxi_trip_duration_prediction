name: "2 - Continuous Delivery"
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  # Runs when the previous stage finished
  workflow_run:
    workflows: ["1 - Continuous Integration"]
    types: [completed]

  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
  MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
  # MLFLOW_TRACKING_URI: "127.0.0.1:5000"
  MLFLOW_EXPERIMENT_NAME: ${{ vars.MLFLOW_EXPERIMENT_NAME }}
  MLFLOW_MODEL_NAME: ${{ vars.MLFLOW_MODEL_NAME }}

jobs:

  train-model:
    # Run only if previous stage finished successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # runs-on: ubuntu-latest
    runs-on: [self-hosted, training]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install uv
      

      # Log in to GitHub Container Registry (GHCR)
      # We will get the serving image with tag staging from here to validate
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Download training image built in the previous stage
      - run: docker pull ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/training:${{ github.sha }}
      
      - run: pip install dvc dvc-ssh
      - run: dvc remote modify --local local_storage url /opt/dvc_storage
      # - run: dvc remote modify --local local_storage url ssh://admin@10.17.0.162:/opt/dvc_storage
      # - run: dvc remote modify --local local_storage url ssh://github.com:/opt/dvc_storage
      
      # Clear local DVC cache to force re-verification and fix potential corruption
      - run: rm -rf .dvc/cache
      
      # Explicitly create cache directory to ensure permissions
      - run: mkdir -p .dvc/cache

      # Debug DVC configuration
      - run: dvc config -l
      
      - run: dvc pull -v -j 4

      # Run training container which runs the training script within
      # The training script will select the "best" model and tag it with the sha of the commit in mlflow
      - name: Run training
        env:
          MLFLOW_TRACKING_URI: "http://10.17.0.162:5000"
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          COMMIT_SHA: ${{ github.sha }}
        
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data:/app/data \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_MODEL_NAME \
            -e MLFLOW_EXPERIMENT_NAME \
            -e COMMIT_SHA \
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/training:${{ github.sha }}

      # Download serving image built in the previous stage
      - run: docker pull ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:${{ github.sha }}


      # Start serving image
      # It is configured to load the model passed in env variable MLFLOW_MODEL_NAME and alias MODEL_ALIAS
      - name: Start serving container
        env:
          MLFLOW_TRACKING_URI: "http://10.17.0.162:5000"
          MODEL_ALIAS: ${{ github.sha }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
        run: |
          docker run -d \
            -v ${{ github.workspace }}/data:/app/data \
            --name serving-app \
            -p 8080:8080 \
            -e MLFLOW_TRACKING_URI \
            -e MODEL_ALIAS \
            -e MLFLOW_MODEL_NAME \
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:${{ github.sha }}
          
          # Wait for Flask to be ready
          sleep 10

      # Run end to end tests, this will test the serving app to see if it is working ok
      # Additional metrics and verification can assess performance metrics as well
      - name: Run Staging tests
        run: uv run pytest src/tests/test_e2e.py -v

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Flask logs ==="
          docker logs serving-app || true

      - name: Clean up serving container
        if: always()
        run: |
          docker rm -f serving-app || true

      # Log in to GitHub Container Registry (GHCR)
      # This is the repository where we will upload our images once they have been validated
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag serving image with staging; this image will be used for further testing in staging
      # Push serving image to repository
      - name: Push serving staging image
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:${{ github.sha }} \
                     ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:staging
          docker push ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:staging

      # Promote selected model to staging to be further validated
      # The script will look for the MLFLOW_MODEL_NAME and promote it from FROM_ALIAS to TO_ALIAS
      - name: Promote model to staging
        env:
          MLFLOW_TRACKING_URI: "http://10.17.0.162:5000"
          MLFLOW_EXPERIMENT_NAME: ${{ env.MLFLOW_EXPERIMENT_NAME }}
          MLFLOW_MODEL_NAME: ${{ env.MLFLOW_MODEL_NAME }}
          FROM_ALIAS: ${{ github.sha }}
          TO_ALIAS: staging
        run: uv run python src/model-promotion/promote_model.py


