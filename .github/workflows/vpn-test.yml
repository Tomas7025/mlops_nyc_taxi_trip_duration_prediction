name: VPN Connectivity Test

on:
  workflow_dispatch:

jobs:
  vpn-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: sudo apt-get update && sudo apt-get install -y openvpn iputils-ping

      - name: Write VPN config files
        run: |
          echo "$VPN_CLIENT_OVPN" > client.ovpn
          echo "$VPN_CA_CRT" > GEANT-CA.crt
          
          # Insert path to credentials file
          # Replace "auth-user-pass" with "auth-user-pass cred.txt"
          sed -i 's/auth-user-pass/auth-user-pass cred.txt/' client.ovpn

      - name: Create credentials file
        run: |
          echo "$VPN_USERNAME" > cred.txt
          echo "$VPN_PASSWORD" >> cred.txt

      - name: Start OpenVPN
        run: |
          sudo openvpn --config client.ovpn --daemon
          sleep 10
          ip addr

      - name: Test connectivity to VM
        run: |
          echo "Pinging VM..."
          ping -c 4 10.17.0.162 || (echo "Failed to reach VM"; exit 1)
