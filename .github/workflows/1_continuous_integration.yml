name: "1 - Continuous Integration"
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  push:
    branches: [ joao-1-2-actions, master]
  pull_request:
    branches: [ joao-1-2-actions, master ]

  workflow_dispatch:

env:
  REGISTRY: ${{ vars.REGISTRY }}
jobs:
  test-unit:
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install uv
      - run: uv sync
      - run: uv run pytest src/serving/test_app.py -v

  build-images:
    # Passed tests, now build docker images for training and serving
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build training image and upload to artifacts for use in continuous delivery
      - name: Build training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/training/Dockerfile
          platforms: linux/amd64
          push: false
          tags: training:${{ github.sha }}
          outputs: type=docker,dest=/tmp/training.tar
      - run: docker load --input /tmp/training.tar

      # Build serving image and upload to artifacts for use in continuous delivery
      - name: Build serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/serving/Dockerfile
          platforms: linux/amd64
          push: false
          tags: serving:${{ github.sha }}
          outputs: type=docker,dest=/tmp/serving.tar
      - run: docker load --input /tmp/serving.tar

      - name: Set lowercase repo name
        run: echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag training image with current commit sha
      # This image will not be used anymore, thus will not be promoted to staging or production so it is linked only to the commit
      # Push training image to repository
      - name: Push training image
        run: |
          docker tag training:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/training:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/training:${{ github.sha }}


      # Tag serving image with commit sha; this image will be used for further testing in the following workflows
      # Push serving image to repository
      - name: Push serving staging image
        run: |
          docker tag serving:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/serving:${{ github.sha }}

      