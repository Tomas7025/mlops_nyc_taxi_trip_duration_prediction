name: 1 - Continuous Integration
run-name: "${{ github.workflow }}"

permissions: write-all

on:
  push:
    branches: [ joao-1-2-actions ]
  pull_request:
    branches: [ joao-1-2-actions ]

  workflow_dispatch:

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install uv
      - run: uv sync
      - run: uv run pytest src/serving/test_app.py -v

  build-images:
    # Passed tests, now build docker images for training and serving
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build training image and upload to artifacts for use in continuous delivery
      - name: Build training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./training/Dockerfile
          platforms: linux/amd64
          push: false
          tags: training:${{ github.sha }}
          outputs: type=docker,dest=/tmp/training.tar
      - run: docker load --input /tmp/training.tar

      