global:
  scrape_interval: 5s 

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'flask_app'
    static_configs:
      # O nome 'serving-app' tem de bater certo com o --name no Deploy Workflow
      - targets: ['serving-app:8080']

  - job_name: 'evidently'
    scrape_interval: 1m
    static_configs:
      - targets: ['evidently-service:8000']