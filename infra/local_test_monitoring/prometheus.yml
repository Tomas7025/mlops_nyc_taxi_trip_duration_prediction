# filepath: infra/local_test_monitoring/prometheus.yml
global:
  scrape_interval: 5s # Scrape a cada 5s para teste (em prod usa-se 15s ou 30s)

rule_files:
  - "prometheus_rules.yml"

scrape_configs:
  - job_name: 'flask_app'
    static_configs:
      - targets: ['serving-app:8080'] # Nome do serviço no docker-compose